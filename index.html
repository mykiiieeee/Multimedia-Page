<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Media Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="page-header">
        <h2>Media Source</h2>
        <div class="header-line"></div>
    </header>

    <main class="container">
        <section class="content-card">
            <h3>Images</h3>
            <div class="media-grid image-grid">
                <img src="assets/images/desir.jpg" alt="Desir">
                <img src="assets/images/adjest.jpg" alt="Adjest">
                <img src="assets/images/romatica.jpg" alt="Romatica">
                <img src="assets/images/pram.jpg" alt="Pram">
                <img src="assets/images/squad.jpg" alt="Squad">
            </div>
        </section>

        <section class="content-card">
            <h3>Audio Tracks</h3>
            <div class="audio-list">
                <div class="audio-item">
                    <span class="track-label">Good Things Fall Apart</span>
                    <audio controls preload="metadata">
                        <source src="assets/audios/GTFA.mp3" type="audio/mpeg">
                    </audio>
                </div>
                <div class="audio-item">
                    <span class="track-label">Senses</span>
                    <audio controls preload="metadata">
                        <source src="assets/audios/MS.mp3" type="audio/mpeg">
                    </audio>
                </div>
                <div class="audio-item">
                    <span class="track-label">Jet Lag</span>
                    <audio controls preload="metadata">
                        <source src="assets/audios/SPJLNB.mp3" type="audio/mpeg">
                    </audio>
                </div>
                <div class="audio-item">
                    <span class="track-label">Ride</span>
                    <audio controls preload="metadata">
                        <source src="assets/audios/TOPR.mp3" type="audio/mpeg">
                    </audio>
                </div>
                <div class="audio-item">
                    <span class="track-label">Till the Credits Roll</span>
                    <audio controls preload="metadata">
                        <source src="assets/audios/TTCR.mp3" type="audio/mpeg">
                    </audio>
                </div>
            </div>
        </section>

        <section class="content-card">
            <h3>Videos</h3>
            <div class="media-grid video-grid">
                <video controls preload="metadata">
                    <source src="assets/videos/AMSTERDAM.mp4" type="video/mp4">
                </video>
                <video controls preload="metadata">
                    <source src="assets/videos/ICELAND.mp4" type="video/mp4">
                </video>
                <video controls preload="metadata">
                    <source src="assets/videos/IRELAND.mp4" type="video/mp4">
                </video>
                <video controls preload="metadata">
                    <source src="assets/videos/JAPAN.mp4" type="video/mp4">
                </video>
                <video controls preload="metadata">
                    <source src="assets/videos/NZ.mp4" type="video/mp4">
                </video>
            </div>
        </section>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const allMedia = document.querySelectorAll('audio, video');

            allMedia.forEach(media => {
                media.addEventListener('play', () => {
                    allMedia.forEach(otherMedia => {
                        if (otherMedia !== media) {
                            otherMedia.pause();
                        }
                    });
                });
            });
        });
    </script>
</body>
</html>
    
</body>
</html>
