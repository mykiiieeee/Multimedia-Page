<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">  
        <title>Document</title>
        <link rel="stylesheet" href="style.css?v=2">
    </head>
    <body>
        <center>
            <h2>Media Source</h2>
            <hr>
        </center>

        <div class="content">
            <h3>Image</h3>
            <div class="media-grid image-grid">
                <img src="assets/images/desir.jpg" alt="Image 1" width="160" height="200">
                <img src="assets/images/adjest.jpg" alt="Image 2" width="160" height="200">
                <img src="assets/images/romatica.jpg" alt="Image 3" width="160" height="200">
                <img src="assets/images/pram.jpg" alt="Image 4" width="160" height="200">
                <img src="assets/images/squad.jpg" alt="Image 5" width="160" height="200">
            </div>
        </div>

         <div class="content">
            <h3>Audio</h3>
            <audio controls preload="metadata">
                <source src="assets/audios/GTFA.mp3" type="audio/mpeg">
            </audio>
            <audio controls preload="metadata">
                <source src="assets/audios/MS.mp3" type="audio/mpeg">
            </audio>
            <audio controls preload="metadata">
                <source src="assets/audios/SPJLNB.mp3" type="audio/mpeg">
            </audio>
            <audio controls preload="metadata">
                <source src="assets/audios/TOPR.mp3" type="audio/mpeg">
            </audio>
            <audio controls preload="metadata">
                <source src="assets/audios/TTCR.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="content">
            <h3>Video</h3>
            <video controls width="240" height="500" preload="metadata">
                <source src="assets/videos/AMSTERDAM.mp4" type="video/mp4">
            </video>
            <video controls width="240" height="500" preload="metadata">
                <source src="assets/videos/ICELAND.mp4" type="video/mp4">
            </video>
            <video controls width="240" height="500" preload="metadata">
                <source src="assets/videos/IRELAND.mp4" type="video/mp4">
            </video>
            <video controls width="240" height="500" preload="metadata">
                <source src="assets/videos/JAPAN.mp4" type="video/mp4">
            </video>
            <video controls width="240" height="500" preload="metadata">
                <source src="assets/videos/NZ.mp4" type="video/mp4">
            </video>
        </div>
    </body>
</html>
